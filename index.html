<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kontak Kami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ── reset & base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue-50:  #EFF6FF;
    --blue-100: #DBEAFE;
    --blue-200: #BFDBFE;
    --blue-500: #3B82F6;
    --blue-600: #2563EB;
    --blue-700: #1D4ED8;
    --blue-800: #1E40AF;
    --gray-50:  #F9FAFB;
    --gray-100: #F3F4F6;
    --gray-200: #E5E7EB;
    --gray-400: #9CA3AF;
    --gray-600: #4B5563;
    --gray-700: #374151;
    --gray-900: #111827;
    --white:    #FFFFFF;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
    --shadow-md: 0 4px 12px rgba(0,0,0,.08);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--gray-50);
    color: var(--gray-900);
    min-height: 100vh;
  }

  /* ── top bar ── */
  .topbar {
    background: var(--white);
    border-bottom: 1px solid var(--gray-200);
    padding: 0 1.5rem;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar-brand {
    font-size: 15px;
    font-weight: 600;
    color: var(--blue-700);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .topbar-brand svg { width: 22px; height: 22px; }
  .topbar-count {
    font-size: 12px;
    color: var(--gray-400);
    font-weight: 400;
  }

  /* ── hero / search strip ── */
  .hero {
    background: linear-gradient(135deg, var(--blue-700) 0%, var(--blue-600) 100%);
    padding: 2.5rem 1.5rem 3.5rem;
    text-align: center;
  }
  .hero h1 {
    color: var(--white);
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .hero p {
    color: var(--blue-200);
    font-size: 13px;
    margin-bottom: 1.5rem;
  }
  .search-wrap {
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }
  .search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    color: var(--gray-400);
    pointer-events: none;
  }
  #search {
    width: 100%;
    padding: 13px 16px 13px 42px;
    font-family: inherit;
    font-size: 14px;
    border: none;
    border-radius: var(--radius-md);
    background: var(--white);
    color: var(--gray-900);
    box-shadow: var(--shadow-md);
    outline: none;
    transition: box-shadow .15s;
  }
  #search:focus { box-shadow: 0 0 0 3px rgba(59,130,246,.3); }
  #search::placeholder { color: var(--gray-400); }

  /* ── filter chips ── */
  .filter-row {
    max-width: 900px;
    margin: -1.25rem auto 0;
    padding: 0 1.5rem;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
  }
  .chip {
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--gray-200);
    background: var(--white);
    color: var(--gray-600);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: all .15s;
    white-space: nowrap;
    user-select: none;
  }
  .chip:hover { border-color: var(--blue-200); color: var(--blue-700); }
  .chip.active {
    background: var(--blue-600);
    border-color: var(--blue-600);
    color: var(--white);
    box-shadow: 0 2px 8px rgba(37,99,235,.35);
  }

  /* ── main content ── */
  .main {
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1.5rem 3rem;
  }

  /* ── region section ── */
  .region-section { margin-bottom: 2.5rem; }
  .region-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .region-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-600);
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .region-badge {
    font-size: 11px;
    font-weight: 500;
    background: var(--blue-50);
    color: var(--blue-700);
    border: 1px solid var(--blue-100);
    border-radius: 999px;
    padding: 2px 8px;
  }

  /* ── cards ── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-lg);
    padding: 16px;
    display: flex;
    flex-direction: column;
    transition: box-shadow .15s, border-color .15s, transform .15s;
    animation: fadeIn .25s ease both;
  }
  .card:hover {
    box-shadow: var(--shadow-md);
    border-color: var(--blue-200);
    transform: translateY(-2px);
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--blue-50);
    color: var(--blue-700);
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
    flex-shrink: 0;
  }
  .card-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-900);
    line-height: 1.3;
    margin-bottom: 3px;
  }
  .card-role {
    font-size: 11px;
    color: var(--gray-400);
    margin-bottom: 12px;
    flex: 1;
    line-height: 1.4;
  }
  .wa-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    background: var(--blue-600);
    color: var(--white);
    font-size: 12px;
    font-weight: 500;
    font-family: inherit;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .wa-btn:hover { background: var(--blue-700); }
  .wa-btn:active { transform: scale(0.97); }
  .wa-btn svg { width: 14px; height: 14px; fill: var(--white); flex-shrink: 0; }

  .group-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 10px;
    margin-top: 6px;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--blue-600);
    font-size: 12px;
    font-weight: 500;
    font-family: inherit;
    text-decoration: none;
    border: 1.5px solid var(--blue-200);
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .1s;
  }
  .group-btn:hover { background: var(--blue-50); border-color: var(--blue-500); }
  .group-btn:active { transform: scale(0.97); }
  .group-btn svg { width: 14px; height: 14px; fill: var(--blue-600); flex-shrink: 0; }

  /* ── states ── */
  .state-wrap {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--gray-400);
  }
  .state-wrap svg { width: 36px; height: 36px; margin-bottom: 12px; opacity: .5; }
  .state-wrap p { font-size: 14px; }
  .state-wrap small { font-size: 12px; display: block; margin-top: 4px; }

  /* ── loading skeleton ── */
  .skeleton-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 12px;
    margin-bottom: 2.5rem;
  }
  .skeleton-card {
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-lg);
    padding: 16px;
    height: 148px;
  }
  .skel {
    background: linear-gradient(90deg, var(--gray-100) 25%, var(--gray-200) 50%, var(--gray-100) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 6px;
  }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  /* ── footer ── */
  .footer {
    text-align: center;
    padding: 1.5rem;
    font-size: 11px;
    color: var(--gray-400);
    border-top: 1px solid var(--gray-200);
    background: var(--white);
  }

  /* ── responsive ── */
  @media (max-width: 480px) {
    .hero { padding: 2rem 1rem 3rem; }
    .hero h1 { font-size: 18px; }
    .main { padding: 0 1rem 3rem; }
    .filter-row { padding: 0 1rem; }
    .cards-grid { grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); }
  }
</style>
</head>
<body>

<!-- ── top bar ── -->
<nav class="topbar">
  <div class="topbar-brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
      <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
    </svg>
    Kontak Kami
  </div>
  <span class="topbar-count" id="total-count"></span>
</nav>

<!-- ── hero ── -->
<section class="hero">
  <h1>Cari kontak recruiter di areamu!</h1>
  <p>Klik Chat untuk mengirimkan CV secara online</p>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" id="search" placeholder="Cari nama, jabatan, atau area…" autocomplete="off" />
  </div>
</section>

<!-- ── region filters ── -->
<div class="filter-row" id="filters"></div>

<!-- ── main directory ── -->
<main class="main" id="main">
  <!-- skeleton shown while loading -->
  <div id="skeleton">
    <div class="skeleton-grid">
      ${Array(8).fill('<div class="skeleton-card"><div class="skel" style="width:40px;height:40px;border-radius:50%;margin-bottom:12px"></div><div class="skel" style="height:13px;width:80%;margin-bottom:6px"></div><div class="skel" style="height:11px;width:55%;margin-bottom:16px"></div><div class="skel" style="height:32px;width:100%;border-radius:8px"></div></div>').join("")}
    </div>
  </div>
  <div id="directory" style="display:none"></div>
</main>

<footer class="footer">
  Data dikelola melalui Google Sheets &mdash; perubahan akan langsung tampil setelah refresh.
</footer>

<script>
// ================================================================
//  ⚠️  STEP 1: Replace the URL below with your Apps Script Web App URL
// ================================================================
const SHEET_URL = "https://script.google.com/macros/s/AKfycbz5jZLbLWrrB0lRTJ4C_KT5N03uYLbeQ7kgfNu01rJm02jLJqSian6-0Bt2tA0R_CZR3g/exec";
// ================================================================

let allContacts = [];
let activeRegion = "All";

function initials(name) {
  return name.trim().split(/\s+/).slice(0, 2).map(w => w[0].toUpperCase()).join("");
}

function getRegions(contacts) {
  const seen = new Set();
  contacts.forEach(c => seen.add(c.region));
  return ["All", ...Array.from(seen).sort()];
}

function renderFilters(contacts) {
  const wrap = document.getElementById("filters");
  wrap.innerHTML = "";
  getRegions(contacts).forEach(r => {
    const btn = document.createElement("button");
    btn.className = "chip" + (r === activeRegion ? " active" : "");
    const count = r === "All" ? contacts.length : contacts.filter(c => c.region === r).length;
    btn.textContent = r === "All" ? `Semua (${count})` : `${r} (${count})`;
    btn.addEventListener("click", () => {
      activeRegion = r;
      renderFilters(contacts);
      renderDirectory(contacts);
    });
    wrap.appendChild(btn);
  });
}

function renderDirectory(contacts) {
  const q = document.getElementById("search").value.toLowerCase().trim();
  const dir = document.getElementById("directory");

  const filtered = contacts.filter(c => {
    const matchQ = !q || [c.name, c.role, c.region, c.notes || ""].some(v => v.toLowerCase().includes(q));
    const matchR = activeRegion === "All" || c.region === activeRegion;
    return matchQ && matchR;
  });

  document.getElementById("total-count").textContent =
    filtered.length === contacts.length
      ? `${contacts.length} kontak`
      : `${filtered.length} dari ${contacts.length} kontak`;

  if (!filtered.length) {
    dir.innerHTML = `<div class="state-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <p>Kontak tidak ditemukan</p>
      <small>Coba kata kunci atau area yang berbeda</small>
    </div>`;
    return;
  }

  const grouped = {};
  filtered.forEach(c => {
    if (!grouped[c.region]) grouped[c.region] = [];
    grouped[c.region].push(c);
  });

  const waIcon = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>`;

  dir.innerHTML = Object.entries(grouped).map(([region, items]) => `
    <section class="region-section">
      <div class="region-header">
        <span class="region-title">${region}</span>
        <span class="region-badge">${items.length} kontak</span>
      </div>
      <div class="cards-grid">
        ${items.map((c, i) => `
          <div class="card" style="animation-delay:${i * 30}ms">
            <div class="avatar">${initials(c.name)}</div>
            <div class="card-name">${c.name}</div>
            <div class="card-role">${c.role || "&nbsp;"}</div>
            <a class="wa-btn" href="https://wa.me/${c.phone}" target="_blank" rel="noopener" aria-label="Chat with ${c.name} on WhatsApp">
              ${waIcon} Chat
            </a>
            ${c.group ? `<a class="group-btn" href="${c.group}" target="_blank" rel="noopener" aria-label="Join grup loker ${c.name}">
              ${waIcon} Join Grup Loker
            </a>` : ""}
          </div>
        `).join("")}
      </div>
    </section>
  `).join("");
}

function showError(msg) {
  document.getElementById("skeleton").style.display = "none";
  document.getElementById("directory").style.display = "block";
  document.getElementById("directory").innerHTML = `<div class="state-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <p>${msg}</p>
    <small>Check the SHEET_URL at the top of this file</small>
  </div>`;
}

async function loadContacts() {
  try {
    if (SHEET_URL.includes("YOUR_SCRIPT_ID_HERE")) {
      showError("Sheet URL not configured yet");
      return;
    }
    const res = await fetch(SHEET_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    allContacts = data.filter(c => c.name && c.phone);
    document.getElementById("skeleton").style.display = "none";
    document.getElementById("directory").style.display = "block";
    document.getElementById("total-count").textContent = `${allContacts.length} kontak`;
    renderFilters(allContacts);
    renderDirectory(allContacts);
  } catch (e) {
    showError("Could not load contacts — " + e.message);
  }
}

document.getElementById("search").addEventListener("input", () => renderDirectory(allContacts));

loadContacts();
</script>
</body>
</html>
